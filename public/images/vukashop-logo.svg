<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-label="VukaShop">
  <title>VukaShop</title>

  <!-- Icon: rounded-square badge with a V mark -->
  <g transform="translate(20, 20)">
    <!-- Badge background -->
    <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#14231C"/>

    <!-- V mark: two curved strokes meeting at bottom-center -->
    <!-- Left stroke — deep moss green -->
    <path d="M 30 28
             Q 33 30 35 35
             L 49 68
             L 50 71"
          stroke="#3B8A58"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Right stroke — warm gold -->
    <path d="M 70 28
             Q 67 30 65 35
             L 51 68
             L 50 71"
          stroke="#E7A93B"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- Small gold dot above the V — "spark" of commerce -->
    <circle cx="50" cy="14" r="3.5" fill="#E7A93B"/>
  </g>

  <!-- Wordmark: VukaShop -->
  <g font-family="'Fraunces', 'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif"
     font-weight="600"
     font-size="68"
     letter-spacing="-1.2">
    <text x="150" y="98">
      <tspan fill="#14231C">Vuka</tspan><tspan fill="#20503C">Shop</tspan>
    </text>
  </g>
</svg>